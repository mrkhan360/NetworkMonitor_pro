
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --noconsole --name NetworkMonitor network_monitor.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NetworkMonitor-Windows
          path: dist/NetworkMonitor.exe
